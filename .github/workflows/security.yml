name: security

# 🚨 Ce workflow ne juge QUE le diff. L'audit de l'ÉTAT du dépôt vit désormais dans audit.yml,
# sur planification — et surtout plus sur les pull requests.
#
# Pourquoi : `npm audit --omit=dev --audit-level=high` auditait l'arbre entier, donc il était
# rouge tant qu'une vulnérabilité restait ouverte — y compris sur une PR qui en corrigeait une.
# Voir e-xode/scripts#9.
#
# `dependency-review-action` fonctionne ici, à la différence des 10 dépôts privés de la flotte :
# ce dépôt est PUBLIC, l'API Dependency Review n'exige pas GitHub Advanced Security dans ce cas.
# Elle ne signale que les advisories INTRODUITES par le diff.

on:
  push:
    branches: ['master']
  pull_request:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (free OSS image, blocking)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --redact --exit-code=1 --no-banner

  deps-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
